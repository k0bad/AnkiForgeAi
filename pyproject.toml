[project]
name = "ankiforgeai"
version = "0.2.0"
description = "AnkiForgeAI — multilingual vocabulary pipeline with AI-powered flashcard generation for any language."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "vladk", email = "101739264+k0bad@users.noreply.github.com" },
]
keywords = [
    "anki",
    "anki-connect",
    "flashcards",
    "language-learning",
    "vocabulary",
    "spaced-repetition",
    "llm",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Utilities",
    "Typing :: Typed",
]
requires-python = ">=3.11"

dependencies = [
    # CLI & UX
    "typer>=0.12",
    "rich>=13.7",
    "questionary>=2.0",
    # Config & validation
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # HTTP & parsing
    "httpx>=0.27",
    "trafilatura>=1.10",
    "beautifulsoup4>=4.12",
    # LLM
    "anthropic>=0.39",
    "openai>=1.30",
    # Dedup
    "rapidfuzz>=3.9",
    # Retry/backoff for network calls
    "tenacity>=8.2",
    # Media
    "edge-tts>=6.1",
    "Pillow>=10.3",
    # Logging
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
ankiforgeai = "ankicards.cli:app"

[project.urls]
Homepage = "https://github.com/k0bad/AnkiForgeAi"
Repository = "https://github.com/k0bad/AnkiForgeAi"
Issues = "https://github.com/k0bad/AnkiForgeAi/issues"
Changelog = "https://github.com/k0bad/AnkiForgeAi/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ankicards"]

[tool.hatch.build.targets.wheel.force-include]
"languages" = "ankicards/languages"
"prompts" = "ankicards/prompts"

[tool.hatch.build.targets.sdist]
include = ["src", "languages", "prompts", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

# Языковой профиль: Norwegian Bokmål
# languages/nb/language.yaml — единственный источник истины для языка.
# Все модули (notetype, grammar, enrichment, TTS) читают этот файл.
# Никакого хардкода под конкретный язык в коде.

code: nb
name: Norwegian Bokmål

# Артикли: true если у существительных есть артикли (en/ei/et, der/die/das, le/la)
article: true

# Названия частей речи на ЦЕЛЕВОМ языке (отображаются на фронте карточки)
pos_labels:
  noun: substantiv
  verb: verb
  adj: adjektiv
  adv: adverb
  pron: pronomen
  prep: preposisjon
  conj: konjunksjon
  interj: interjeksjon
  num: tallord
  phrase: frase / uttrykk
  other: annet

# Схема грамматических форм для каждой POS.
# Каждый элемент: {key: имя_поля_в_JSON, label: читаемое_название}
# key используется в card.forms как ключ dict.
# label — как подпись в таблице на бэк-стороне карточки.
forms:
  noun:
    - {key: gender, label: Kjønn}
    - {key: indefinite_singular, label: Ubestemt entall}
    - {key: definite_singular, label: Bestemt entall}
    - {key: indefinite_plural, label: Ubestemt flertall}
    - {key: definite_plural, label: Bestemt flertall}
  verb:
    - {key: infinitive, label: Infinitiv}
    - {key: present, label: Presens}
    - {key: past, label: Preteritum}
    - {key: perfect, label: Perfektum}
  adj:
    - {key: positive_common, label: "Felleskjønn (m/f)"}
    - {key: positive_neuter, label: "Intetkjønn (n)"}
    - {key: positive_plural, label: Flertall}
    - {key: comparative, label: Komparativ}
    - {key: superlative, label: Superlativ}

# edge-tts голоса для этого языка
tts:
  voice_female: nb-NO-PernilleNeural
  voice_male: nb-NO-FinnNeural
  default_voice: female

# Настройки Anki для этого языка
anki:
  deck_name: Norsk
  note_type: LanguageCard    # универсальное имя Note Type — не NorskCard

# Переводы label'ов на бэк-стороне карточки (язык пользователя)
# Эти надписи видны на оборотной стороне карточки в Anki
back_labels:
  translation: Перевод
  part_of_speech: Часть речи
  grammar: Грамматика
  example: Пример
  example_translation: Перевод примера
  pronunciation: Транскрипция
  level: Уровень
  topic: Тема
# Темы, которых в картинном словаре нет и быть не может: его дерево
# описывает предметы (еда, животные, части тела), а глаголу, наречию или
# предлогу там места не отведено — ни одной темы под них. Слова из учебника без
# этого списка оседают одной плоской кучей `leksjon`, и сортировать их можно
# только по pos::. Используются `enrich topics` наравне с темами, уже
# встречающимися в базе.
extra_topics:
  handlinger::bevegelse: "движение и положение тела: ходить, бегать, сидеть, купаться"
  handlinger::hverdag: "повседневные и рабочие действия: строить, выбирать, встречать, планировать"
  handlinger::tanke-og-tale: "речь, мысль, чувство: думать, спрашивать, скучать, верить"
  egenskaper: "признак, качество, свойство — прилагательные: точный, сладкий, немой, бесшумный"
  småord::mengde: "количество и степень: много, мало, только, довольно, очень"
  småord::sted-og-retning: "служебные слова места и направления: между, над, слева, рядом с"
  småord::tid: "служебные слова времени: всегда, медленно, завтра, потом"
  småord::andre: "прочие служебные слова: какие, все, друг друга, и... и, вместе"
  språk-og-skrift: "язык и письмо: слово, предложение, заголовок, знак, произношение, правило"
  butikk-og-handel: "магазин и покупки: кошелёк, тележка, корзина, пакет, товар"
  arbeid-og-yrke: "работа и профессии: профессия, представитель, участник, подменяющий"
  gård-og-landbruk: "ферма и хозяйство: сарай, забор, пашня, сено, пугало"
  former-og-figurer: "формы и фигуры: линия, круг, крестик, квадрат"
  bygninger-og-by: "здания и городская среда: церковь, лифт, столовая, читальный зал, скамья"
  hus-og-hjem::gang: "прихожая, коридор: вешалка, подставка для зонтов, обувница"
